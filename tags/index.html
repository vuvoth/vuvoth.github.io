ventDefault(),e.stopPropagation(),window.location.href=`https://${location.hostname}/tags`;else if(t==="i"){e.preventDefault(),e.stopPropagation();const t=document.querySelectorAll("input");for(let e=0;e<t.length;e++)if(t[e].offsetParent!==null){t[e].selectionStart=t[e].selectionEnd=t[e].value.length,t[e].focus();break}}return!1})</script><script defer>function throttle(e,t){var n=Date.now();return function(){var s=Date.now();n+t-s<0&&(e(),n=s)}}function scrollHandler(){const e=Array.from(document.querySelectorAll("body h2, body h3"));function t(){for(var n,s,o,i=window.pageYOffset||document.documentElement.scrollTop,t=0;t<e.length;t++)s=e[t].getAttribute("id"),n=document.querySelector('nav ul li a[href="#'+s+'"]'),n&&n.classList.remove("active-toc");for(t=e.length-1;t>=0;t--)if(o=e[t].offsetTop,i>o-75&&(s=e[t].getAttribute("id"),n=document.querySelector('nav ul li a[href="#'+s+'"]'),n)){n.classList.add("active-toc");break}}window.addEventListener("scroll",throttle(t,200))}setTimeout(scrollHandler,100)</script><script defer>function getTextContentRecursively(e){let t="";if(e.nodeType===Node.TEXT_NODE)return e.textContent||"";for(const n of e.childNodes)t+=getTextContentRecursively(n);return t}function addCopyButtonToCodeBlocks(){const e=document.querySelectorAll('code[class^="language-"]:not(.output):not([class*="language-console"])');e.forEach(e=>{const t=document.createElement("button");t.classList.add("copy-code-button"),t.innerHTML="copy",t.addEventListener("click",()=>{const n=getTextContentRecursively(e);navigator.clipboard.writeText(n),t.innerHTML="copied!",setTimeout(()=>{t.innerHTML="copy"},1500)}),e.parentNode.before(t)})}setTimeout(function(){addCopyButtonToCodeBlocks()},100)</script><script>window.store={"https://vuvoth.github.io/posts/build-my-first-split-keyboard/":{title:"Build My First Split Keyboard",tags:["Keyboard"],content:`Overview One day in 2025 (or maybe early 2026 — I don&rsquo;t remember), I was focusing on my task and engineering work. And boom&hellip; my wrist started to hurt&hellip; It was the first time I had felt this kind of pain, so I tried to research how to fix it. At first, I thought it was caused by the switch: I had only been using the laptop keyboard, and around that time I switched to a normal keyboard. I was typing too much on the new keyboard, and the area around my wrist hurt. I researched more and came across the keyword: &ldquo;Carpal tunnel syndrome&rdquo;1.
So I surfed the internet and randomly jumped down the rabbit hole of split keyboards. A split keyboard lets you place each half at shoulder width, keeping your wrists straight and your shoulders relaxed, which greatly reduces the strain that causes the pain.
I ordered my first split keyboard: the Sofle (58 keys). However, I was not happy with it, so I bought a new one: the Corne (42 keys) — you can easily find images of both online. The Corne was better, but I still felt it was not built for me. I needed Choc switches, not MX, and after watching a video by Ben Vallack, I decided to build the Ferris Sweep: it is easy to build (the wired version), it is Choc-spaced, and there are a ton of layouts I can copy from the internet.
This was a super interesting process, but also an awful one. However, in the end, I finally got my dream keyboard. I am going to share the mistakes I made in this project, and I hope they help you avoid a few problems if you decide to DIY2 a keyboard.
The Build: One Mistake at a Time Well, I think I made a lot of mistakes. Haha, this was my first time, and first times are always messy for sure.
But first, let&rsquo;s see what we need to build the keyboard:
The PCB (Printed Circuit Board) 34+ keyboard switches and keycaps 34+ hotswap sockets (so I can swap in new switches whenever I want) 2x RP2040 Pro Micro and 4 pin headers A TRRS cable 2x reset switches Oh, and yes, you also need soldering tools:
A soldering iron with temperature control Solder wire A soldering iron stand The flow is simple:
Solder the PCB and MCU (Microcontroller Unit) Solder the hotswap sockets Flash the firmware using QMK Mission accomplished Most of these parts you can buy from a local shop or from e-commerce sites. The PCB is the exception — it has to be manufactured. After googling, I saw that people use JLCPCB, so I used a third-party service to ship it from China to my country. I downloaded the PCB design from davidphilipbarr/Sweep, and the version I chose was the Sweep Bling LP. After 2 weeks, I got my PCBs — 5 pieces, so in theory I could build 5 keyboards. Wow&hellip; And so the process of trial and error began.
First Mistake: Soldering — Nothing Went Like in the Videos In the first step, you need to connect the Pro Micro to the PCB. To do this, you just solder the headers to the PCB, and after that, solder the Pro Micro to the headers. This sounds easy, right? But&hellip; I failed at it.
Somehow, soldering the Pro Micro did not go as smoothly as in the videos I had watched. The hotswap sockets went just as badly.
I spent some time investigating these problems. My first assumption was that the iron tip was oxidized. I thought that when I used the iron for the first time, I adjusted the temperature too high (the recommendation is 350°C or 250°C — I don&rsquo;t remember exactly), but I saw it sitting at around 400°C, and that oxidized the tip. I searched for a fix and tried a few things, including tip tinner and cleaner. But nothing worked. So I concluded that my iron tip was completely destroyed. And I moved on to plan B: buying a new iron tip.
Yes, I bought the new tip. It was delivered to me after 3 days. And you know what? The problem was&hellip; still not solved. So I thought maybe the soldering iron itself was the issue — maybe the temperature controller was showing the wrong numbers — and I bought a new iron without a temperature controller to test my assumption. And once again: one more attempt, one more failure. After 1 week of soldering, I had ruined 2 PCBs, plus a lot of sockets and headers. You can see the best result here:
I tried googling and asking on forums. People were friendly and generous with their help, but nothing solved it. I almost gave up on this project and even contacted a shop to solder the keyboards for me. I put this project on hold&hellip; maybe I will come back to it in a few weeks.
Second Attempt: Flashing the Firmware After a week of working and calming down, I had a new idea: &ldquo;Okay, maybe I can&rsquo;t solder, but surely I can flash firmware — it&rsquo;s a software task, so I should be good at it, right?&rdquo; I could ask for help with the soldering, but I could customize the keymaps and flash the keyboard by myself. So I started studying how keyboards work and how to flash them.
I recommend watching this video — it explains really well how keyboards work in a nutshell:
How to Build a Handwired Keyboard:
TL;DR: a keyboard is a matrix — when we press a key, it connects two pins on the Pro Micro, and the MCU sends a signal to the computer telling it which character we want to type. Bonus: the Ferris Sweep is diode-less by design (the QMK firmware detects ghost keys in software), so no diode soldering is needed.
Now the dilemma: should I use the QMK Configurator or the CLI? I went with the CLI because it is cooler :D and somehow this actually helped me. I will skip some of the process, but here is the basic idea:
Install QMK: Getting Started guide Connect the Pro Micro to the computer Put it into bootloader mode and drop the firmware file into the bootloader drive Do it again on the second half (but I couldn&rsquo;t do that yet, because I couldn&rsquo;t connect the second MCU — soldering still not working :D&hellip;) Yes, this was for one MCU only :D — and I hadn&rsquo;t even practiced it yet.
The Breakthrough: It Was the Solder Wire Maybe 1 week later, I was lying lazily on my bed when I suddenly realized there was one thing I hadn&rsquo;t tried: the soldering wire. Could that be it — was I using the wrong type? I checked, and it wasn&rsquo;t the wrong type — it was 63/37 solder wire. However, I noticed something: I had bought a cheap no-name solder wire for about 2 USD, while a good one costs about the same — 2 USD for 5 meters. So I ordered the good one — and just like that, the problem was gone. The soldering process was smooth and worked perfectly, and the only thing remaining was flashing the keyboard.
I ran into many more issues along the way — perhaps I&rsquo;ll cover those in Build My First Split Keyboard — Pt. 2.
Every developer should know about carpal tunnel syndrome: hours of typing with poor wrist posture put pressure on the median nerve, and if ignored, it can lead to numbness, lasting pain, or even surgery.&#160;&#x21a9;&#xfe0e;
DIY stands for &ldquo;Do It Yourself&rdquo; — building something yourself from parts instead of buying it ready-made.&#160;&#x21a9;&#xfe0e;

I&rsquo;m a coffee newbie, so I will talk about things like coffee-making tools, coffee specialty, and brew styles. This blog also focuses on the engineering side: topics like cryptography, programming languages, and other interesting stuff.
Hope you enjoy and have a good day!
